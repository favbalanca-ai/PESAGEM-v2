<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body { font-family: Arial; width: 250px; padding: 12px; margin: 0; background: #f5f5f5; }
  h3 { margin: 0 0 8px; color: #1a3a6c; font-size: 13px; }
  .status { font-size: 11px; color: #555; margin-bottom: 10px; line-height: 1.4; }
  label { font-size: 11px; color: #333; font-weight: bold; display: block; margin-bottom: 3px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 6px; font-size: 12px;
    border: 1px solid #bbb; border-radius: 4px; }
  .dica { font-size: 10px; color: #777; margin: 3px 0 10px; line-height: 1.35; }
  .linha { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .linha label { margin: 0; font-weight: normal; }
  button { width: 100%; padding: 8px; background: #c0392b; color: white;
    border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button:hover { background: #a93226; }
  .verde { background: #1a6c3c; } .verde:hover { background: #145a32; }
  #aviso { font-size: 11px; color: #1a6c3c; height: 14px; }
</style>
</head>
<body>
  <h3>🤖 FAV - Emissor NFA</h3>
  <div class="status" id="status">Verificando dados pendentes...</div>

  <label for="pasta">Pasta das notas</label>
  <input type="text" id="pasta" placeholder="NFA">
  <div class="dica">Dentro da pasta <b>Downloads</b>. Dá para usar subpastas: <b>NFA/2026</b>.
    O Chrome não deixa a extensão gravar fora de Downloads.</div>

  <div class="linha">
    <input type="checkbox" id="manter">
    <label for="manter">Guardar o PDF no computador</label>
  </div>
  <div class="dica">Desmarcado, o arquivo some depois de ir para o Drive.</div>

  <div id="aviso"></div>
  <button class="verde" id="btnLimpar">🗑️ Limpar dados pendentes</button>
  <script src="popup.js"></script>
</body>
</html>
